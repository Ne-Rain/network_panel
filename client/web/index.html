<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>NetPanel 局域网文件</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
                    <rect width="40" height="40" rx="11" fill="currentColor"/>
                    <path d="M11 16a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2z" fill="none" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M16 21h8" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <span>NetPanel</span>
            </div>
            <span class="header-caption">局域网文件</span>
        </div>
    </header>

    <main class="workspace">
        <section id="login-panel" class="card login-card" aria-labelledby="login-title">
            <div class="card-intro">
                <h1 id="login-title">登录 NetPanel</h1>
                <p>使用网盘账号查看本组和公共文件。</p>
            </div>

            <form id="login-form" method="post" action="/api/login">
                <div class="field">
                    <label for="username">账号</label>
                    <input id="username" name="username" type="text" placeholder="输入账号"
                           autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" placeholder="输入密码"
                           autocomplete="current-password" required>
                </div>
                <p id="login-error" class="message error-message" role="alert" hidden></p>
                <button id="login-button" class="primary-button" type="submit">登录</button>
                <p id="login-status" class="message login-status" role="status" hidden></p>
            </form>
        </section>

        <section id="files-panel" class="card files-card" aria-labelledby="files-title" hidden>
            <div class="files-header">
                <div class="card-intro">
                    <h1 id="files-title" tabindex="-1">文件列表</h1>
                    <p id="account-label"></p>
                </div>
                <span id="file-count" class="count" aria-live="polite"></span>
            </div>
            <div id="table-container" class="table-container" hidden>
                <table>
                    <caption class="visually-hidden">当前账号可访问的文件</caption>
                    <thead>
                        <tr>
                            <th scope="col">编号</th>
                            <th scope="col">文件名</th>
                        </tr>
                    </thead>
                    <tbody id="file-rows"></tbody>
                </table>
            </div>
            <div id="empty-state" class="empty-state" hidden>
                <svg viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
                    <path d="M5 13a3 3 0 0 1 3-3h7l3 3h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                </svg>
                <h2>暂无可见文件</h2>
                <p>你已登录，当前文件列表为空。</p>
            </div>
        </section>

        <noscript><p class="message error-message">请启用 JavaScript 后使用 NetPanel。</p></noscript>
    </main>
</body>
</html>
